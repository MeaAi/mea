name: MEAFLOW-72 drawdown timing diagnostics
on:
  push:
    branches:
      - research/meaflow72-drawdown-timing-v1
    paths:
      - "research/meaflow72_drawdown_timing.py"
      - ".github/workflows/meaflow72-drawdown-timing.yml"
permissions:
  contents: write
concurrency:
  group: meaflow72-drawdown-timing-v1
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/meaflow72-drawdown-timing-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run peak-to-trough timing diagnostics
        run: python research/meaflow72_drawdown_timing.py
      - name: Publish timing report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research-results/meaflow72_drawdown_timing.json
          git commit -m "Publish MEAFLOW-72 drawdown timing report"
          git push origin HEAD:research/meaflow72-drawdown-timing-v1
