name: EXP-043 spot-perpetual basis signal screen
on:
  push:
    branches:
      - research/exp043-basis-factor-screen
    paths:
      - ".github/workflows/exp043-basis-factor-screen.yml"
      - "research/exp043_basis_screen.py"
permissions:
  contents: read
concurrency:
  group: exp043-basis-factor-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/exp043-basis-factor-screen
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python research/exp043_basis_screen.py
      - uses: actions/upload-artifact@v6
        with:
          name: exp043-basis-screen-results
          path: research-results/exp043_basis_screen.json
          retention-days: 90
