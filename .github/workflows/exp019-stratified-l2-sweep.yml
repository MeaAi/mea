name: EXP-019 stratified MEAFLOW-72 actual-order L2 sweep

on:
  push:
    branches:
      - research/meaflow-exp019-stratified-l2-sweep-v1
    paths:
      - research/exp019_stratified_l2_sweep.py
      - .github/workflows/exp019-stratified-l2-sweep.yml

permissions:
  contents: write

concurrency:
  group: exp019-stratified-l2-sweep
  cancel-in-progress: false

jobs:
  stratified-l2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/meaflow-exp019-stratified-l2-sweep-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct frozen MEAFLOW-72 OOS orders and sweep stratified L2 books
        run: python research/exp019_stratified_l2_sweep.py
      - name: Publish compact report only
        if: always()
        run: |
          if [ -f research-results/exp019_stratified_l2_sweep.json ]; then
            test "$(stat -c%s research-results/exp019_stratified_l2_sweep.json)" -lt 1000000
            rm -rf research-output
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-results/exp019_stratified_l2_sweep.json
            git commit -m "Publish EXP-019 stratified actual-order L2 sweep" || exit 0
            git push origin HEAD:research/meaflow-exp019-stratified-l2-sweep-v1
          fi
