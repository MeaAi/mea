name: Binance public-data research pilot # ephemeral storage, compact reports only; February 2024 validation

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "Start month (YYYY-MM)"
        required: true
        default: "2024-02"
        type: string
      end_month:
        description: "End month (YYYY-MM); pilot max 2 months"
        required: true
        default: "2024-02"
        type: string
      symbols:
        description: "Comma-separated symbols (BTCUSDT,ETHUSDT,SOLUSDT)"
        required: true
        default: "BTCUSDT"
        type: string
  push:
    branches:
      - research/binance-data-pipeline
    paths:
      - ".github/workflows/binance-research.yml"
      - "research/binance_public_pipeline.py"
      - "research/orderflow_diagnostic.py"

permissions:
  contents: write

concurrency:
  group: binance-public-research-v3
  cancel-in-progress: false

jobs:
  acquire-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_MONTH: ${{ github.event.inputs.start_month || '2024-02' }}
      END_MONTH: ${{ github.event.inputs.end_month || '2024-02' }}
      SYMBOLS: ${{ github.event.inputs.symbols || 'BTCUSDT' }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v6
        with:
          ref: research/binance-data-pipeline
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download public Binance archives and run data QA
        run: |
          python research/binance_public_pipeline.py \
            --start "$START_MONTH" \
            --end "$END_MONTH" \
            --symbols "$SYMBOLS" \
            --out research-output
      - name: Run exploratory order-flow diagnostics
        run: |
          python research/orderflow_diagnostic.py \
            --input "research-output/*-1m-orderflow.csv.gz" \
            --out research-output/orderflow_diagnostic.json
      - name: Publish compact reports; discard all downloaded and processed market data
        run: |
          mkdir -p research-results
          cp research-output/qa_report.json research-results/qa_report.json
          cp research-output/orderflow_diagnostic.json research-results/orderflow_diagnostic.json
          # The runner is ephemeral; keep only small summary reports in the repository.
          du -ah research-output | sort -h | tail -20
          rm -rf research-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/qa_report.json research-results/orderflow_diagnostic.json
          git commit -m "Publish compact Binance research reports" || echo "No report changes"
          git fetch origin research/binance-data-pipeline
          git rebase origin/research/binance-data-pipeline
          git push origin HEAD:research/binance-data-pipeline
