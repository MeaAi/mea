name: Binance public-data research pilot

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "Start month (YYYY-MM)"
        required: true
        default: "2024-01"
        type: string
      end_month:
        description: "End month (YYYY-MM); pilot max 2 months"
        required: true
        default: "2024-01"
        type: string
      symbols:
        description: "Comma-separated symbols (BTCUSDT,ETHUSDT,SOLUSDT)"
        required: true
        default: "BTCUSDT"
        type: string
  push:
    branches:
      - research/binance-data-pipeline
    paths:
      - ".github/workflows/binance-research.yml"

permissions:
  contents: write

concurrency:
  group: binance-public-research
  cancel-in-progress: false

jobs:
  acquire-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_MONTH: ${{ github.event.inputs.start_month || '2024-01' }}
      END_MONTH: ${{ github.event.inputs.end_month || '2024-01' }}
      SYMBOLS: ${{ github.event.inputs.symbols || 'BTCUSDT' }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v6
        with:
          ref: research/binance-data-pipeline
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download public Binance archives and run data QA
        run: |
          python research/binance_public_pipeline.py \
            --start "$START_MONTH" \
            --end "$END_MONTH" \
            --symbols "$SYMBOLS" \
            --out research-output
      - name: Publish readable QA report back to research branch
        run: |
          mkdir -p research-results
          cp research-output/qa_report.json research-results/qa_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/qa_report.json
          git commit -m "Publish Binance public-data QA report" || echo "No report changes"
          git push origin HEAD:research/binance-data-pipeline
      - name: Keep compressed feature data as optional short-lived artifact
        uses: actions/upload-artifact@v6
        with:
          name: binance-orderflow-pilot
          path: research-output/*-1m-orderflow.csv.gz
          if-no-files-found: error
          retention-days: 7
