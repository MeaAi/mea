name: EXP047 basis incremental to funding
on:
  push:
    branches:
      - research/exp047-basis-funding-incremental
    paths:
      - research/exp047_basis_funding_incremental.py
      - .github/workflows/exp047-basis-funding-incremental.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Run preregistered screen
        run: python research/exp047_basis_funding_incremental.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: exp047-basis-funding-incremental-results
          path: exp047_results.json
          retention-days: 90
