name: MEAFLOW-72 retention multi-window robustness
on:
  push:
    branches:
      - research/meaflow72-retention-multiwindow-v1
    paths:
      - "research/meaflow72_retention_multiwindow.py"
      - ".github/workflows/meaflow72-retention-multiwindow.yml"
permissions:
  contents: write
concurrency:
  group: meaflow72-retention-multiwindow-v1
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/meaflow72-retention-multiwindow-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run multi-window fixed-retention tests on free Binance Vision data
        run: python research/meaflow72_retention_multiwindow.py
      - name: Publish research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research-results/meaflow72_retention_multiwindow.json
          git commit -m "Publish MEAFLOW-72 retention multi-window report"
          git push origin HEAD:research/meaflow72-retention-multiwindow-v1
