name: EXP-022 CryptoHFTData actual order L2 replay

on:
  push:
    branches:
      - research/meaflow-exp022-cryptohftdata-order-replay-v1
    paths:
      - research/exp022_cryptohftdata_actual_order_replay.py
      - .github/workflows/exp022-cryptohftdata-actual-order-replay.yml

permissions:
  contents: write

concurrency:
  group: exp022-cryptohftdata-actual-order-replay
  cancel-in-progress: false

jobs:
  l2-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/meaflow-exp022-cryptohftdata-order-replay-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Reconstruct books and sweep actual order deltas
        run: python research/exp022_cryptohftdata_actual_order_replay.py
      - name: Publish compact report and discard raw files
        if: always()
        run: |
          if [ -f research-results/exp022_cryptohftdata_actual_order_replay.json ]; then
            test "$(stat -c%s research-results/exp022_cryptohftdata_actual_order_replay.json)" -lt 1000000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-results/exp022_cryptohftdata_actual_order_replay.json
            git commit -m "Publish EXP-022 actual-order L2 replay" || exit 0
            git push origin HEAD:research/meaflow-exp022-cryptohftdata-order-replay-v1
          fi
