name: MEAFLOW-72 portfolio drawdown scaling experiment
on:
  push:
    branches:
      - research/meaflow72-drawdown-scaling-v1
    paths:
      - "research/funding_carry_liquidation_drawdown.py"
      - "research/meaflow72_drawdown_scaling.py"
      - ".github/workflows/meaflow72-drawdown-scaling.yml"
permissions:
  contents: write
concurrency:
  group: meaflow72-drawdown-scaling-v1
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/meaflow72-drawdown-scaling-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated drawdown scaling experiment
        run: python research/meaflow72_drawdown_scaling.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research-results/meaflow72_drawdown_scaling.json
          git commit -m "Publish MEAFLOW-72 drawdown scaling results"
          git pull --rebase origin research/meaflow72-drawdown-scaling-v1
          git push origin HEAD:research/meaflow72-drawdown-scaling-v1
