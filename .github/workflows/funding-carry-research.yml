name: Cross-sectional funding carry research

on:
  push:
    branches:
      - research/binance-data-pipeline
    paths:
      - "research/funding_carry_backtest.py"
      - ".github/workflows/funding-carry-research.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funding-carry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  funding-carry:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-data-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download free Binance Vision funding and hourly prices, then test
        run: |
          python research/funding_carry_backtest.py \
            --start 2024-01 --end 2026-10 \
            --symbols BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,SOLUSDT,LINKUSDT,LTCUSDT,BCHUSDT,DOTUSDT,TRXUSDT,AVAXUSDT \
            --out research-output/funding_carry_backtest.json
      - name: Publish results and remove raw downloads
        run: |
          mkdir -p research-results
          cp research-output/funding_carry_backtest.json research-results/
          rm -rf research-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/funding_carry_backtest.json
          git commit -m "Publish cross-sectional funding carry results" || exit 0
          git pull --rebase origin research/binance-data-pipeline
          git push
