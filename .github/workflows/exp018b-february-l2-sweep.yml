name: EXP-018B February actual order L2 sweep

on:
  push:
    branches:
      - research/meaflow-exp018-tardis-signal-probe-v1
    paths:
      - research/exp018_february_actual_order_l2_sweep.py
      - .github/workflows/exp018b-february-l2-sweep.yml

permissions:
  contents: write

concurrency:
  group: exp018b-february-l2-sweep
  cancel-in-progress: false

jobs:
  l2-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/meaflow-exp018-tardis-signal-probe-v1
      - name: Reconstruct February book and sweep actual order deltas
        run: python research/exp018_february_actual_order_l2_sweep.py
      - name: Publish compact report only
        if: always()
        run: |
          if [ -f research-results/exp018_february_actual_order_l2_sweep.json ]; then
            test "$(stat -c%s research-results/exp018_february_actual_order_l2_sweep.json)" -lt 1000000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-results/exp018_february_actual_order_l2_sweep.json
            git commit -m "Publish EXP-018B February actual-order L2 sweep" || exit 0
            git push origin HEAD:research/meaflow-exp018-tardis-signal-probe-v1
          fi
