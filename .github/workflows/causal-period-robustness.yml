name: MEAFLOW-52 causal calendar period robustness
on:
  push:
    branches:
      - research/causal-period-robustness-v1
    paths:
      - "research/causal_period_robustness.py"
      - ".github/workflows/causal-period-robustness.yml"
permissions:
  contents: write
concurrency:
  group: meaflow-causal-period-robustness-v1
  cancel-in-progress: false
jobs:
  period-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/causal-period-robustness-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download free Binance Vision data and run fixed causal period tests
        run: python research/causal_period_robustness.py
      - name: Publish compact report only
        run: |
          rm -rf research-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/causal_period_robustness.json
          git commit -m "Publish causal calendar period robustness results" || exit 0
          git pull --rebase origin research/causal-period-robustness-v1
          git push origin HEAD:research/causal-period-robustness-v1
