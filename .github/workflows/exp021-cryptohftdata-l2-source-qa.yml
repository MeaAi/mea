name: EXP-021 free CryptoHFTData L2 source QA

on:
  push:
    branches:
      - research/meaflow-exp021-cryptohftdata-l2-probe-v1
    paths:
      - research/exp021_cryptohftdata_l2_source_qa.py
      - .github/workflows/exp021-cryptohftdata-l2-source-qa.yml

permissions:
  contents: write

concurrency:
  group: exp021-cryptohftdata-l2-source-qa
  cancel-in-progress: false

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/meaflow-exp021-cryptohftdata-l2-probe-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Download and inspect five exact signal-hour L2 files
        run: python research/exp021_cryptohftdata_l2_source_qa.py
      - name: Publish compact QA report only
        if: always()
        run: |
          if [ -f research-results/exp021_cryptohftdata_l2_source_qa.json ]; then
            test "$(stat -c%s research-results/exp021_cryptohftdata_l2_source_qa.json)" -lt 1000000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-results/exp021_cryptohftdata_l2_source_qa.json
            git commit -m "Publish EXP-021 CryptoHFTData L2 source QA" || exit 0
            git push origin HEAD:research/meaflow-exp021-cryptohftdata-l2-probe-v1
          fi
