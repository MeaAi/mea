name: EXP-015 Tardis Binance Futures L2 source probe

on:
  push:
    branches:
      - research/meaflow-exp015-l2-source-probe-v1
    paths:
      - .github/workflows/exp015-l2-source-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp015-l2-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/meaflow-exp015-l2-source-probe-v1
      - name: Probe actual public sample files (no API key)
        run: |
          python - <<'PY'
          import csv, gzip, hashlib, json, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          base = "https://datasets.tardis.dev/v1/binance-futures"
          date = ("2024", "07", "01")
          symbol = "BTCUSDT"
          kinds = ["incremental_book_L2", "trades"]
          out = {"experiment":"EXP-015-SOURCE-PROBE", "status":"completed_probe",
                 "source":"Tardis downloadable CSV, unauthenticated first-of-month sample",
                 "date_utc":"2024-07-01", "exchange":"binance-futures",
                 "symbol":symbol, "files":{}}
          for kind in kinds:
              url = f"{base}/{kind}/{date[0]}/{date[1]}/{date[2]}/{symbol}.csv.gz"
              item = {"url":url}
              path = Path(f"/tmp/{kind}.csv.gz")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"MEAFLOW-research/1.0"})
                  with urllib.request.urlopen(req, timeout=90) as response, path.open("wb") as f:
                      item["http_status"] = response.status
                      item["content_type"] = response.headers.get("Content-Type")
                      item["content_length_header"] = response.headers.get("Content-Length")
                      h = hashlib.sha256()
                      size = 0
                      while True:
                          chunk = response.read(1024*1024)
                          if not chunk: break
                          f.write(chunk); h.update(chunk); size += len(chunk)
                  item["download_bytes"] = size
                  item["sha256"] = h.hexdigest()
                  if size == 0:
                      item["valid_gzip"] = False
                      item["error"] = "zero-byte response"
                  else:
                      rows = 0; first = None; last = None; header = None
                      snapshots = 0; sample = []
                      with gzip.open(path, "rt", encoding="utf-8", newline="") as stream:
                          reader = csv.DictReader(stream)
                          header = reader.fieldnames
                          for row in reader:
                              rows += 1
                              if len(sample) < 3: sample.append(row)
                              lt = row.get("local_timestamp")
                              if lt:
                                  if first is None: first = lt
                                  last = lt
                              if row.get("is_snapshot","").lower() == "true": snapshots += 1
                      item.update({"valid_gzip":True, "csv_rows":rows, "columns":header,
                                   "first_local_timestamp_us":first,
                                   "last_local_timestamp_us":last,
                                   "snapshot_rows":snapshots if kind=="incremental_book_L2" else None,
                                   "sample_rows":sample})
                      required = ({"exchange","symbol","timestamp","local_timestamp","is_snapshot","side","price","amount"}
                                  if kind=="incremental_book_L2" else
                                  {"exchange","symbol","timestamp","local_timestamp","id","side","price","amount"})
                      item["required_columns_present"] = required.issubset(set(header or []))
                      item["symbol_rows_match"] = all(r.get("symbol") == symbol for r in sample)
                      if rows == 0: item["error"] = "valid gzip but empty CSV"
              except urllib.error.HTTPError as e:
                  item.update({"http_status":e.code, "error":str(e)})
              except Exception as e:
                  item["error"] = repr(e)
              out["files"][kind] = item
              print(kind, json.dumps(item, ensure_ascii=False)[:3000], flush=True)
          out["all_files_usable"] = all(
              x.get("http_status")==200 and x.get("valid_gzip") and
              x.get("csv_rows",0)>0 and x.get("required_columns_present") and
              x.get("symbol_rows_match") for x in out["files"].values())
          Path("exp015_source_probe.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
          print("PROBE_RESULT", json.dumps({"all_files_usable":out["all_files_usable"],
                "files":{k:{a:v.get(a) for a in ("http_status","download_bytes","csv_rows","valid_gzip","required_columns_present","error")}
                         for k,v in out["files"].items()}}, ensure_ascii=False), flush=True)
          if not out["all_files_usable"]:
              raise SystemExit("EXP-015 source probe blocked: one or more public files are missing, empty, invalid, or schema-incompatible")
          PY
      - name: Publish source-probe report
        if: always()
        run: |
          if [ -f exp015_source_probe.json ]; then
            mkdir -p research-results
            cp exp015_source_probe.json research-results/exp015_source_probe.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-results/exp015_source_probe.json
            git commit -m "Publish EXP-015 public L2 source probe" || exit 0
            git push origin HEAD:research/meaflow-exp015-l2-source-probe-v1
          fi
