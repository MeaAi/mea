name: EXP-014 frozen pilot / independent OOS validation

on:
  push:
    branches:
      - research/meaflow-exp014-independent-oos-v1
    paths:
      - "research/exp014_independent_oos.py"
      - ".github/workflows/exp014-independent-oos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp014-independent-oos
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/meaflow-exp014-independent-oos-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire frozen calibration pilot (May-June 2024)
        run: |
          python research/binance_public_pipeline.py --start 2024-05 --end 2024-06 --symbols BTCUSDT,ETHUSDT,SOLUSDT --out pilot-data
          python research/binance_bookdepth_pipeline.py --start 2024-05 --end 2024-06 --symbols BTCUSDT,ETHUSDT,SOLUSDT --out pilot-data
      - name: Acquire independent OOS period (July-August 2024)
        run: |
          python research/binance_public_pipeline.py --start 2024-07 --end 2024-08 --symbols BTCUSDT,ETHUSDT,SOLUSDT --out oos-data
          python research/binance_bookdepth_pipeline.py --start 2024-07 --end 2024-08 --symbols BTCUSDT,ETHUSDT,SOLUSDT --out oos-data
      - name: Run frozen-threshold OOS evaluation
        env:
          WORKFLOW_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python research/exp014_independent_oos.py \
            --pilot-flow "pilot-data/*-1m-orderflow.csv.gz" \
            --pilot-book "pilot-data/*-bookdepth-1m.csv.gz" \
            --test-flow "oos-data/*-1m-orderflow.csv.gz" \
            --test-book "oos-data/*-bookdepth-1m.csv.gz" \
            --out exp014_independent_oos.json
          python - <<'PY'
          import json, os
          p="exp014_independent_oos.json"
          d=json.load(open(p))
          d["provenance"]={
            "workflow_commit_sha":os.environ["WORKFLOW_COMMIT_SHA"],
            "workflow_run_id":os.environ["WORKFLOW_RUN_ID"],
            "data_source":"Official Binance Vision USD-M Futures archives; monthly 1m klines + aggTrades; daily bookDepth",
            "branch":"research/meaflow-exp014-independent-oos-v1"
          }
          json.dump(d,open(p,"w"),indent=2)
          PY
      - name: Publish compact report only
        run: |
          mkdir -p research-results
          cp exp014_independent_oos.json research-results/exp014_independent_oos.json
          rm -rf pilot-data oos-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/exp014_independent_oos.json
          git commit -m "Publish EXP-014 independent OOS report" || exit 0
          git push origin HEAD:research/meaflow-exp014-independent-oos-v1
