name: MEAFLOW-72 peak-to-trough per-symbol attribution
on:
  push:
    branches:
      - research/meaflow72-dd-interval-attribution-v1
    paths:
      - "research/meaflow72_dd_interval_attribution.py"
      - "research/funding_carry_liquidation_fixed.py"
      - ".github/workflows/meaflow72-dd-interval-attribution.yml"
permissions:
  contents: write
concurrency:
  group: meaflow72-dd-interval-attribution-v1
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/meaflow72-dd-interval-attribution-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run peak-to-trough attribution diagnostics
        run: python research/meaflow72_dd_interval_attribution.py
      - name: Publish attribution report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research-results/meaflow72_dd_interval_attribution.json
          git commit -m "Publish MEAFLOW-72 drawdown interval attribution"
          git push origin HEAD:research/meaflow72-dd-interval-attribution-v1

# Re-trigger diagnostic after workflow registration.
